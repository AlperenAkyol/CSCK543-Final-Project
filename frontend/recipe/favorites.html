<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Recipes</title>
    <style>
        :root {
            --primary-color: #808000;
            --secondary-color: #6b6b00;
            --background-color: #f9f9f5;
            --text-color: #333;
            --light-text: #777;
            --white: #fff;
            --shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        body {
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h2 { color: var(--primary-color); margin-bottom: 20px; text-align: center; }
        #favoriteList {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        #favoriteList li {
            background-color: var(--white);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow);
        }
        #favoriteList a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
        }
        #favoriteList .category {
            color: var(--light-text);
            font-size: 0.9rem;
        }
        #favoriteList .score {
            color: var(--primary-color);
            font-weight: bold;
        }
        .back-btn {
            display: block;
            margin: 0 auto 20px;
            width: max-content;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.3s;
        }
        .back-btn:hover { background-color: var(--secondary-color); }
        @media (max-width: 768px) {
            #favoriteList { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <a class="back-btn" href="recipes.html">&lt; Back to All Recipes</a>
    <h2>★ My Favorite Recipes</h2>
    <ul id="favoriteList"></ul>
    <script>
        const user_id = 1; // (Dummy value) Replace with actual user ID/session if available

        async function loadFavorites() {
            let res = await fetch("../../backend/recipe/favorites_list.php?user_id=" + user_id);
            let data = await res.json();
            let list = document.getElementById('favoriteList');
            list.innerHTML = '';
            if (data.length === 0) {
                list.innerHTML = "<li>You have no favorites yet.</li>";
                return;
            }
            data.forEach(r => {
                let li = document.createElement('li');
                li.innerHTML = `<a href="recipe.html?id=${r.id}">${r.title}</a> 
                                <span class="category">(${r.category})</span>
                                <span class="score">Score: ${r.score || 0}</span>`;
                list.appendChild(li);
            });
        }
        loadFavorites();
    </script>
</body>
</html>
