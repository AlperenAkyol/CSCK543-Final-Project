<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe List</title>
    <style>
        :root {
            --primary-color: #808000; /* Olive green */
            --secondary-color: #6b6b00;
            --background-color: #f9f9f5;
            --text-color: #333;
            --light-text: #777;
            --white: #fff;
            --shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
            font-size: 2rem;
        }

        #searchForm {
            display: flex;
            margin-bottom: 30px;
            gap: 10px;
        }

        #searchInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        #searchInput:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        #searchForm button {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        #searchForm button:hover {
            background-color: var(--secondary-color);
        }

        #recipeList {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        #recipeList li {
            background-color: var(--white);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        #recipeList li:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #recipeList a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            display: block;
            margin-bottom: 5px;
        }

        #recipeList a:hover {
            text-decoration: underline;
        }

        #recipeList .category {
            color: var(--light-text);
            font-size: 0.9rem;
            display: inline-block;
            margin-right: 10px;
        }

        #recipeList .score {
            color: var(--primary-color);
            font-weight: bold;
        }

        #recipeList .rate-link {
            display: inline-block;
            margin-top: 10px;
            color: var(--white);
            background-color: var(--primary-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            text-decoration: none;
        }

        #recipeList .rate-link:hover {
            background-color: var(--secondary-color);
            text-decoration: none;
        }

        .recipe-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .logout-btn {
            display: block;
            width: 100%;
            max-width: 200px;
            margin: 30px auto 0;
            padding: 12px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .logout-btn:hover {
            background-color: var(--secondary-color);
        }

        @media (max-width: 768px) {
            #recipeList {
                grid-template-columns: 1fr;
            }
            
            #searchForm {
                flex-direction: column;
            }
            
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <h2>All Recipes</h2>
    <form id="searchForm">
        <input id="searchInput" placeholder="Search by title or category" />
        <button type="submit">Search</button>
    </form>
    <ul id="recipeList"></ul>
    <button class="logout-btn" onclick="logout()">Logout</button>

    <script>
        // Sample data for demonstration with images
        const sampleRecipes = [
            {
                id: 1,
                title: "Spaghetti Bolognese",
                category: "Italian",
                score: 0.0,
                image: "https://ichef.bbci.co.uk/food/ic/food_16x9_1600/recipes/spaghetti_bolognese_43191_16x9.jpg"
            },
            {
                id: 2,
                title: "Vegan Pancakes",
                category: "Vegan",
                score: 0.0,
                image: "https://ichef.bbci.co.uk/food/ic/food_16x9_1600/recipes/vegan_american_pancakes_76094_16x9.jpg"
            },
            {
                id: 3,
                title: "Healthy Pizza",
                category: "Healthy",
                score: 0.0,
                image: "https://ichef.bbci.co.uk/food/ic/food_16x9_1600/recipes/healthy_pizza_55143_16x9.jpg"
            },
            {
                id: 4,
                title: "Easy Lamb Biryani",
                category: "Indian",
                score: 0.0,
                image: "https://ichef.bbci.co.uk/food/ic/food_16x9_1600/recipes/easy_lamb_biryani_46729_16x9.jpg"
            },
            {
                id: 5,
                title: "Couscous Salad",
                category: "Salad",
                score: 0.0,
                image: "https://ichef.bbci.co.uk/food/ic/food_16x9_832/recipes/pearl_couscous_25307_16x9.jpg"
            },
            {
                id: 6,
                title: "Plum clafoutis",
                category: "Dessert",
                score: 0.0,
                image: "https://ichef.bbci.co.uk/food/ic/food_16x9_1600/recipes/plumclafoutis_11536_16x9.jpg"
            },
            {
                id: 7,
                title: "Mango Pie",
                category: "Dessert",
                score: 0.0,
                image: "https://ichef.bbci.co.uk/food/ic/food_16x9_1600/recipes/mango_pie_18053_16x9.jpg"
            },
            {
                id: 8,
                title: "Mushroom Doner",
                category: "Vegetarian",
                score: 0.0,
                image: "https://ichef.bbci.co.uk/food/ic/food_16x9_1600/recipes/mushroom_doner_22676_16x9.jpg"
            }
        ];

        async function loadRecipes(q='') {
            try {
                let url = q ? "../../backend/recipe/search.php?q=" + encodeURIComponent(q) : "../../backend/recipe/list.php";
                let res = await fetch(url);
                
                if (!res.ok) {
                    throw new Error('Network response was not ok');
                }
                
                let data = await res.json();
                renderRecipes(data);
            } catch (error) {
                console.error('Error fetching recipes:', error);
                // Fallback to sample data if API fails
                const filteredRecipes = q ? filterRecipes(q) : sampleRecipes;
                renderRecipes(filteredRecipes);
            }
        }

        function renderRecipes(recipes) {
            const list = document.getElementById('recipeList');
            list.innerHTML = '';
            
            recipes.forEach(recipe => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <img src="${recipe.image || 'placeholder.jpg'}" alt="${recipe.title}" class="recipe-image">
                    <a href="recipe-details.html?id=${recipe.id}">${recipe.title}</a>
                    <span class="category">(${recipe.category})</span>
                    <span class="score">Score: ${recipe.score || 0}</span>
                    <a class="rate-link" href="rate.html?id=${recipe.id}">Rate</a>
                `;
                list.appendChild(li);
            });
        }

        function filterRecipes(query) {
            if (!query) {
                return sampleRecipes;
            }
            
            const lowerQuery = query.toLowerCase();
            return sampleRecipes.filter(recipe => 
                recipe.title.toLowerCase().includes(lowerQuery) || 
                recipe.category.toLowerCase().includes(lowerQuery)
            );
        }

        document.getElementById('searchForm').addEventListener('submit', e => {
            e.preventDefault();
            const query = document.getElementById('searchInput').value;
            loadRecipes(query);
        });

        function logout() {
            // In a real app, this would clear session data
            alert('Logging out...');
            window.location.href = "../user/login.html";
        }

        // Initial load - tries to fetch from backend first, falls back to sample data
        loadRecipes();
    </script>

	  <!-- Footer section -->
        <footer>
            <p>&copy; 2025 Recipes. All rights reserved.</p>
            <p>Contact us: info@Recipes.com</p>
        </footer>
	
</body>
</html>
