<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>
  <h2>Login</h2>
  <form id="loginForm">
    <input name="username_or_email" placeholder="Username or Email" required /><br>
    <input name="password" type="password" placeholder="Password" required /><br>
    <button type="submit">Login</button>
  </form>
  <div id="result"></div>

  <script>
    document.getElementById("loginForm").onsubmit = async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const resp = await fetch("../../backend/user/login.php", {
        method: "POST",
        body: formData
      });
      const json = await resp.json();
      document.getElementById("result").textContent = json.message;
      if (json.success) {
        // Optionally, redirect or show next steps
      }
    };
  </script>
</body>
</html>
